body {
	background-image: url(images/backgrounds/fanartbackground.png);

}

.artistcontainer {
	display: flex;

}

.thumbnailcontainer {
	display: flex;
	flex-flow: column wrap;
	justify-content: center;

}

.thumbnailinnercontainer {
	display: flex;
	flex-flow: row wrap;
	margin-top: 10px;
	margin-bottom: 10px;
	gap: 10px;
	width: 950px;
}

.thumb {
	width: 150px;
	height: 150px;
}

.socialsbuttoncontainer {
	display: flex;
	position: absolute; left: 0; right: 0; top: 43px; bottom: 0px;
	flex-flow: row wrap; align-items: center; justify-content: center;
	margin-left: auto; margin-right: auto;
}

.umami {
	display: flex;
	position: absolute; left: 165px; top: 30px;
	background-color: black;
	height: 3px;
	width: 3px;
	transition: 0.2s;
	border-radius: 50%;
}

.umami:hover {
	background-color: #0056ff;
}

.umami:active {
	background-color: white;
}
